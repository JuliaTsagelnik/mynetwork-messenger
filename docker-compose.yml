version: '3.8'

services:
  # Наш сервер на FastAPI
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db

  # База данных PostgreSQL (выполняет требование по томам и БД)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: # Сохранение данных при перезапуске